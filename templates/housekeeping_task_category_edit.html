{% extends "base.html" %}

{% block content %}

<h2>Edit Housekeeping Category</h2>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<form method="post">

    <p>
        <label>Category Name</label><br>

        <input
            type="text"
            name="category_name"
            value="{{ category.category_name }}"
            required
            autofocus
        >
    </p>

    <p>
        <button type="submit">
            Save Changes
        </button>

        <a href="{{ url_for('housekeeping_task_categories') }}">
            Cancel
        </a>
    </p>

</form>

{% endblock %}
