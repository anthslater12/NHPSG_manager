{% extends "base.html" %}

{% block content %}

<h2>Edit Housekeeping Category</h2>

{% if error %}
    <div class="error">
        {{ error }}
    </div>
{% endif %}

<form method="post" action="{{ url_for('housekeeping_task_category_edit', category_id=category.category_id, status=status_filter) }}">

    <p>
        <label>Category Name</label><br>

        <input
            type="text"
            name="category_name"
            value="{{ category.category_name }}"
            required
            autofocus
        >
    </p>

    <p>
        <button type="submit">
            Save Changes
        </button>

        <a href="{{ url_for('housekeeping_task_categories', status=status_filter) }}">
            Cancel
        </a>
    </p>

</form>

{% endblock %}
