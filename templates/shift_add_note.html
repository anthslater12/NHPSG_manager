{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Staff Notes for this Shift</h2>

    <p>
        <strong>{{ shift.shift_type }} Shift</strong><br>
        {{ shift.shift_date }}
    </p>

    {% if editable %}
        <form method="post">
            <label for="note_text">Shared staff notes</label>
            <textarea
                id="note_text"
                name="note_text"
                rows="8"
                required
            >{{ note.note_text if note else "" }}</textarea>
            <button type="submit">Save Staff Notes</button>
        </form>
    {% elif note %}
        <p>{{ note.note_text }}</p>
    {% else %}
        <p>No staff notes entered for this shift yet.</p>
    {% endif %}

    <p><a href="/shift/{{ shift.shift_id }}">Back to Shift</a></p>
</div>

{% endblock %}
