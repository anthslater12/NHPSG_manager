{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Edit Care Category</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('care_task_category_edit', category_id=category.category_id, status=status_filter) }}">

        <label>Category Name</label>

        <input
            type="text"
            name="category_name"
            value="{{ category.category_name }}"
            required
            autofocus
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>

    </form>

    <p>
        <a href="{{ url_for('care_task_categories', status=status_filter) }}">
            Back to Care Categories
        </a>
    </p>

</div>

{% endblock %}
