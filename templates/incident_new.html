{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>New Incident Report</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">

        <!-- Top Row -->

        <div style="display:flex; gap:15px; align-items:flex-end; margin-bottom:20px;">

            <div style="width:160px;">
                <label>Date of Incident</label>
                <input
                    type="date"
                    name="incident_date"
                    value="{{ request.form.get('incident_date', '') }}"
                    required>
            </div>

            <div style="width:140px;">
                <label>Time of Incident</label>
                <input
                    type="time"
                    name="incident_time"
                    value="{{ request.form.get('incident_time', '') }}"
                    required>
            </div>

            <div style="width:240px;">
                <label>Incident Type</label>

                <select
                    name="incident_type"
                    required>

                    <option value="">Select type</option>

                    {% for incident_option in [
                        'Aggression', 'Self Injury', 'Property Damage',
                        'Medical', 'Behaviour', 'Other'
                    ] %}
                        <option value="{{ incident_option }}"{% if request.form.get('incident_type') == incident_option %} selected{% endif %}>{{ incident_option }}</option>
                    {% endfor %}

                </select>

            </div>

            <div style="flex:1;">
                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    value="{{ request.form.get('location', '') }}">
            </div>

        </div>

        <label>What occurred?</label>

        <textarea
            name="description"
            rows="6"
            required>{{ request.form.get('description', '') }}</textarea>

        <br><br>

        <label>Actions Taken</label>

        <textarea
            name="actions_taken"
            rows="5">{{ request.form.get('actions_taken', '') }}</textarea>

        <br><br>

        <label>Witnesses</label>

        <input
            type="text"
            name="witnesses"
            value="{{ request.form.get('witnesses', '') }}">

        <br><br>

        <label style="display:inline-flex; align-items:center; gap:8px;">

            <input
                type="checkbox"
                name="injury"
                style="width:auto; margin:0; padding:0;"
                {% if request.form.get('injury') %}checked{% endif %}>

            Was anyone injured?

        </label>

        <br><br>

        <label>Injury Details</label>

        <textarea
            name="injury_details"
            rows="4">{{ request.form.get('injury_details', '') }}</textarea>

        <br><br>

        <button type="submit">
            Save Incident
        </button>

        <a href="{{ url_for('incident_list') }}"
           class="button-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
