{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Add Shift Note</h2>

    <form method="post">
        <label>Shift Date</label>
        <input type="date" name="shift_date" required>

        <label>Shift</label>
        <select name="shift_type" required>
            <option value="">Select shift</option>
            <option value="Day">Day</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Overnight">Overnight</option>
        </select>

        <label>Notes</label>
        <textarea name="note_text" rows="8" required></textarea>

        <label>
            <input type="checkbox" name="follow_up_required" style="width:auto;">
            Follow-up required
        </label>

        <br><br>

        <button type="submit">Save Shift Note</button>
    </form>
</div>

{% endblock %}
