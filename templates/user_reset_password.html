{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Reset Password</h2>

    <p>
        <strong>User:</strong> {{ user.full_name }}<br>
        <strong>Username:</strong> {{ user.username }}<br>
        <strong>Role:</strong> {{ user.role }}
    </p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('reset_user_password', user_id=user.user_id, status=status_filter) }}">
        <label>Temporary Password</label>
        <input type="password" name="password" required>

        <label>Confirm Temporary Password</label>
        <input type="password" name="confirm_password" required>

        <br><br>

        <button type="submit">Reset Password</button>
    </form>

    <p><a href="{{ url_for('users', status=status_filter) }}">Cancel / Back to Users</a></p>
</div>

{% endblock %}
