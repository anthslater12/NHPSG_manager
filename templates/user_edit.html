{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Edit Staff Member</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('user_edit', user_id=user.user_id, status=status_filter) }}">
        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ user.full_name }}" required>

        <label>Username</label>
        <input type="text" name="username" value="{{ user.username }}" required>

        <label>Role</label>
        <select name="role" required>
            <option value="Support Worker" {% if user.role == "Support Worker" %}selected{% endif %}>Support Worker</option>
            <option value="Program Manager" {% if user.role == "Program Manager" %}selected{% endif %}>Program Manager</option>
            <option value="Director" {% if user.role == "Director" %}selected{% endif %}>Director</option>
            <option value="Behaviour Consultant" {% if user.role == "Behaviour Consultant" %}selected{% endif %}>Behaviour Consultant</option>
            <option value="Admin" {% if user.role == "Admin" %}selected{% endif %}>Admin</option>
        </select>

        <label>
            <input type="checkbox" name="active" style="width:auto;" {% if user.active %}checked{% endif %}>
            Active account
        </label>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('users', status=status_filter) }}">Back to Users</a></p>
</div>

{% endblock %}
