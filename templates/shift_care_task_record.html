{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Record Care Task</h2>

{% if error %}
    <div class="error-message">
        {{ error }}
    </div>
{% endif %}

<h3>{{ task.task_name }}</h3>

<p><strong>Instructions</strong></p>

<p>{{ task.instructions }}</p>

<hr>

<form method="post">

    <label>Status</label>

    <select name="status" required>
        <option value="">Select...</option>

        <option value="Completed"
            {% if selected_status == "Completed" %}selected{% endif %}>
            Completed
        </option>

        <option value="Attempted"
            {% if selected_status == "Attempted" %}selected{% endif %}>
            Attempted
        </option>

        <option value="Not Completed"
            {% if selected_status == "Not Completed" %}selected{% endif %}>
            Not Completed
        </option>

    </select>

    <br><br>

    <label>Comment</label>

    <textarea
        name="comment"
        rows="4"
        placeholder="Enter a comment if required..."
    >{{ comment or "" }}</textarea>

    <br><br>

    <button type="submit">Save</button>

    <a href="/shift/{{ shift.shift_id }}">Cancel</a>

</form>

</div>

{% endblock %}
