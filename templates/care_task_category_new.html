{% extends "base.html" %}

{% block content %}

<div class="card">

<h2>Add Care Task Category</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="post">

<label>Category Name</label>

<input
    type="text"
    name="category_name"
    required
>

<br><br>

<button type="submit">
    Save Category
</button>

</form>

<p>
<a href="/care-task-categories">
Back to Categories
</a>
</p>

</div>

{% endblock %}
