{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Add Worker Resource</h2>

    <p>
        <a href="{{ url_for('worker_resources') }}">Back to Worker Resources</a>
    </p>

    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ form_values.title }}" required maxlength="200">

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6" maxlength="5000">{{ form_values.description }}</textarea>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="">Select a category</option>
            {% for category in categories %}
                <option value="{{ category }}" {% if form_values.category == category %}selected{% endif %}>{{ category }}</option>
            {% endfor %}
        </select>

        <label for="resource_type">Resource Type</label>
        <select id="resource_type" name="resource_type" required>
            <option value="">Select a resource type</option>
            {% for resource_type in resource_types %}
                <option value="{{ resource_type }}" {% if form_values.resource_type == resource_type %}selected{% endif %}>{{ resource_type }}</option>
            {% endfor %}
        </select>

        <label for="display_order">Display Order</label>
        <input type="number" id="display_order" name="display_order" min="0" value="{{ form_values.display_order }}" required>

        <label for="file">File</label>
        <input type="file" id="file" name="file" required>
        <p>Allowed files depend on the selected resource type. Maximum size: 500 MB.</p>

        <button type="submit">Upload Resource</button>
    </form>
</div>
{% endblock %}
